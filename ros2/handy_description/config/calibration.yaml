# Handy joint calibration in ivaDynamixel terms (encoder ticks):
#   init  encoder value at joint angle 0
#   min   encoder value at the joint's lower limit   (min > max = joint is flipped)
#   max   encoder value at the joint's upper limit
#   slave_calibration_offset  slave goal = MAX_POSITION - master goal + offset
# GENERATED by `handy calibrate zero|limits` -- re-run instead of hand-editing.
# These defaults are uncalibrated: model center as zero, full servo range as limits.
