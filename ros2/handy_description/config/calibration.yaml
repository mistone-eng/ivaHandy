  joint_3: {init: 2048, min: 0, max: 4095}
  joint_4: {init: 2048, min: 0, max: 4095}
  joint_5: {init: 2048, min: 0, max: 4095}
  joint_6: {init: 2048, min: 4095, max: 0}
  joint_7: {init: 2048, min: 0, max: 4095}
  joint_8: {init: 512, min: 0, max: 1023, slave_calibration_offset: 1}
