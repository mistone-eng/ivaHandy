# Handy servo table for ivaDynamixel (third_party/ivaDynamixel, plugin iva_dynamixel_hardware).
# Hand-edited. Keys are the ivaDynamixel joint parameters (the ROS 1 controller YAML names).
# Per-joint calibration (init/min/max, slave_calibration_offset) is in calibration.yaml,
# written by handy_calibrate -- do not put it here.
bus:
  port_name: /dev/ttyUSB0
  baud_rate: 1000000

defaults:                     # applied to every joint unless a joint overrides the key
  joint_speed: 1.16           # rad/s (= the old moving_speed 100 raw on AX/EX, 97 on MX)
  joint_torque_limit: 0.782   # fraction of max torque (= the old torque_limit 800/1023)

joints:                       # models are auto-detected on ping; listed here for reference
  joint_1: {id: 1}            # EX-106+
  joint_2: {id: 2}            # MX
  joint_3: {id: 3}            # EX-106+
  joint_4: {id: 4}            # EX-106+
  joint_5: {id: 5}            # MX
  joint_6: {id: 6}            # MX (flipped: min > max in calibration.yaml)
  joint_7: {id: 7}            # MX
  joint_8: {id: 8, slave_id: 9}  # AX-12 gripper; id 9 mirrors it (JointPositionControllerDualMotor)
