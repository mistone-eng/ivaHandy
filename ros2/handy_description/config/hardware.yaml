# Handy servo table -- the single source of truth for which servo drives which joint.
# Read by urdf/handy.ros2_control.xacro and by handy_calibrate. Edit by hand.
#
#   id     Dynamixel bus id
#   model  AX | RX | EX | MX   (Protocol 1.0)
#   sign   +1 / -1: joint direction relative to increasing servo ticks
#   follows / multiplier: state-only servo whose goal = leader command * multiplier
#
# Per-joint zero offsets are NOT here: they are measured into calibration.yaml.
bus:
  port: /dev/ttyUSB0
  baud: 1000000
  moving_speed: 100    # Protocol 1.0: 0 = UNLIMITED, never use 0
  torque_limit: 800    # 0..1023

joints:
  joint_1: {id: 1, model: EX, sign: 1}
  joint_2: {id: 2, model: MX, sign: 1}
  joint_3: {id: 3, model: EX, sign: 1}
  joint_4: {id: 4, model: EX, sign: 1}
  joint_5: {id: 5, model: MX, sign: 1}
  joint_6: {id: 6, model: MX, sign: -1}
  joint_7: {id: 7, model: MX, sign: 1}
  joint_8: {id: 8, model: AX, sign: 1}
  joint_9: {id: 9, model: AX, sign: 1, follows: joint_8, multiplier: -1}
