# Real Handy arm through the U2D2 -- LINUX HOSTS ONLY.
# Docker Desktop on macOS/Windows cannot pass USB serial devices into containers.
#
#   docker compose -f docker-compose.yml -f docker-compose.hardware.yml up -d
#
# Set the U2D2 latency timer on the HOST first (/sys is read-only in the container):
#   echo 1 | sudo tee /sys/bus/usb-serial/devices/ttyUSB0/latency_timer
services:
  handy:
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    # The desktop user is created at container start without the dialout group, so open the
    # device up instead (needs Docker Compose >= 2.30; otherwise run `sudo chmod a+rw /dev/ttyUSB0`
    # once inside the container).
    post_start:
      - command: chmod a+rw /dev/ttyUSB0
        user: root
